<script src="https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/sadsatan/scripts/modernjscheck.js"></script>
<script src="https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/sadsatan/scripts/supportcheck.js"></script>
<script>
    (() => {
        const activeTouches = new Map();

        function dispatchPointer(type, touch, target) {
            if (typeof PointerEvent !== "function") return;

            target.dispatchEvent(new PointerEvent(type, {
                bubbles: true,
                cancelable: true,
                pointerId: touch.identifier,
                pointerType: "mouse",
                isPrimary: activeTouches.size === 0,
                button: 0,
                buttons: type === "pointerup" ? 0 : 1,
                clientX: touch.clientX,
                clientY: touch.clientY,
                pageX: touch.pageX,
                pageY: touch.pageY,
                pressure: type === "pointerup" ? 0 : 0.5
            }));
        }

        window.addEventListener("touchstart", event => {
            for (const touch of event.changedTouches) {
                dispatchPointer("pointerdown", touch, event.target);
                activeTouches.set(touch.identifier, event.target);
            }
        }, { capture: true, passive: true });

        window.addEventListener("touchend", event => {
            for (const touch of event.changedTouches) {
                const target = activeTouches.get(touch.identifier) || event.target;
                dispatchPointer("pointerup", touch, target);
                activeTouches.delete(touch.identifier);
            }
        }, { capture: true, passive: true });

        window.addEventListener("touchcancel", event => {
            for (const touch of event.changedTouches) {
                activeTouches.delete(touch.identifier);
            }
        }, { capture: true, passive: true });
    })();
</script>
