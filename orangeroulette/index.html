<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orange Roulette</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    ruffle-player {
      display: block;
      transform-origin: center center;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="viewport"></div>

  <script>
    const SWF_URL = "https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/orangeroulette/orangeroulette.swf";

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      scale: "showAll",
      align: "center",
      letterbox: "on",
      autoplay: "on",
      unmuteOverlay: "visible",
      contextMenu: "on",
      splashScreen: true
    };

    function fitPlayerToScreen(player) {
      if (!player) return;

      const meta = player.metadata || {};
      const nativeW = meta.width || player.clientWidth || 800;
      const nativeH = meta.height || player.clientHeight || 600;

      player.style.width = nativeW + "px";
      player.style.height = nativeH + "px";

      const scaleX = window.innerWidth / nativeW;
      const scaleY = window.innerHeight / nativeH;
      const scale = Math.min(scaleX, scaleY);

      player.style.transform = `scale(${scale})`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const viewport = document.getElementById("viewport");

      viewport.appendChild(player);
      fitPlayerToScreen(player);

      window.addEventListener("resize", () => fitPlayerToScreen(player));

      player.ruffle().load({
        url: SWF_URL,
        allowScriptAccess: true
      }).then(() => {
        fitPlayerToScreen(player);
        // Re-apply after startup frames in case the SWF changes stage size on start
        setTimeout(() => fitPlayerToScreen(player), 250);
        setTimeout(() => fitPlayerToScreen(player), 1000);
        setTimeout(() => fitPlayerToScreen(player), 2500);
      }).catch((err) => {
        console.error("Failed to load SWF:", err);
      });
    });
  </script>
</body>
</html>
