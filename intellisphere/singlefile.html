<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <title>IntelliSphere</title>
  <base href="https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/intellisphere/">
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    body { touch-action: none; text-align: center; }
    #canvas { display: block; margin: 0; color: #fff; }
    #canvas:focus { outline: none; }
    #status {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; visibility: hidden;
    }
    #status-progress {
      width: 366px; height: 7px; padding: 1px; visibility: visible;
      background: #38363a; border: 1px solid #444246; border-radius: 2px;
    }
    #status-progress-inner {
      width: 0; height: 100%; box-sizing: border-box; transition: width .5s linear;
      background: #202020; border: 1px solid #222223; border-radius: 3px;
    }
    #status-indeterminate { visibility: visible; position: relative; }
    #status-indeterminate > div {
      width: 4.5px; height: 0; position: absolute; border-style: solid;
      border-width: 9px 3px 0; border-color: #2b2b2b transparent transparent;
      transform-origin: center 21px;
    }
    #status-indeterminate > div:nth-child(1) { transform: rotate(22.5deg); }
    #status-indeterminate > div:nth-child(2) { transform: rotate(67.5deg); }
    #status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
    #status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
    #status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
    #status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
    #status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
    #status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }
    #status-notice {
      margin: 0 100px; padding: 4px 6px; line-height: 1.3; visibility: visible;
      color: #e0e0e0; background: #3b3943; border: 1px solid #45434e;
    }
    @media only screen and (orientation: portrait) {
      #status-progress { width: 61.8%; }
    }
  </style>
</head>
<body>
  <canvas id="canvas">HTML5 canvas appears to be unsupported in the current browser.</canvas>
  <div id="status">
    <div id="status-progress" style="display:none"><div id="status-progress-inner"></div></div>
    <div id="status-indeterminate" style="display:none">
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
    </div>
    <div id="status-notice" style="display:none"></div>
  </div>
  <script src="intellisphere.js"></script>
  <script>
    const GODOT_CONFIG = {
      args: [],
      canvasResizePolicy: 2,
      executable: 'intellisphere',
      experimentalVK: false,
      fileSizes: { 'intellisphere.pck': 111670656, 'intellisphere.wasm': 17493574 },
      fileParts: { 'intellisphere.pck': 6 },
      focusCanvas: true,
      gdnativeLibs: []
    };
    const engine = new Engine(GODOT_CONFIG);
    const status = document.getElementById('status');
    const progress = document.getElementById('status-progress');
    const progressInner = document.getElementById('status-progress-inner');
    const indeterminate = document.getElementById('status-indeterminate');
    const notice = document.getElementById('status-notice');
    let initializing = true;
    let statusMode = 'hidden';

    function setStatusMode(mode) {
      if (!initializing || statusMode === mode) return;
      [progress, indeterminate, notice].forEach((element) => { element.style.display = 'none'; });
      if (mode === 'progress') progress.style.display = 'block';
      if (mode === 'indeterminate') indeterminate.style.display = 'block';
      if (mode === 'notice') notice.style.display = 'block';
      status.style.visibility = mode === 'hidden' ? 'hidden' : 'visible';
      statusMode = mode;
    }
    function showError(error) {
      notice.textContent = error.message || error;
      setStatusMode('notice');
      initializing = false;
    }
    if (!Engine.isWebGLAvailable()) {
      showError('WebGL not available');
    } else {
      setStatusMode('indeterminate');
      engine.startGame({ onProgress(current, total) {
        if (total > 0) {
          progressInner.style.width = `${current / total * 100}%`;
          setStatusMode('progress');
        } else {
          setStatusMode('indeterminate');
        }
      }}).then(() => {
        setStatusMode('hidden');
        initializing = false;
      }, showError);
    }
  </script>
</body>
</html>
