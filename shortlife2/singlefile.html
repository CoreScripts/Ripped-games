        var start = Date.now();
        var finished = false;
        var shown = -1;

        function paint(p) {
            p = Math.max(0, Math.min(100, Math.round(p)));
            if (p === shown) return;
            shown = p;
            bar.style.width = p + '%';
            pctEl.textContent = p + '%';
        }

        function finish() {
            if (finished) return;
            finished = true;
            paint(100);
            setTimeout(function () {
                screen.style.opacity = '0';
                setTimeout(function () { screen.style.display = 'none'; }, 400);
            }, 250);
            clearInterval(timer);
        }

        var timer = setInterval(function () {
            if (finished) return;
            var sr = Math.min(1, B.scripts / SCRIPT_TOTAL);
            var ar = Math.min(1, B.assets / EXPECTED_ASSETS);
            var p = 6 + 9 * sr + 80 * ar;
            if (p > 95) p = 95;

            var idle = Date.now() - (B.last || start);
            var hasCanvas = !!document.querySelector('#content canvas');

            if (p >= 100) finish();
            else paint(p);
