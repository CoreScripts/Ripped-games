<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <base href="https://raw.githubusercontent.com/CoreScripts/Ripped-games/main/DJR/">
        <script>
            // Images must opt into CORS before their source is assigned because the
            // game reads pixels for tones, snapshots, and blend-mode checks.
            (function () {
                var srcProp = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
                Object.defineProperty(HTMLImageElement.prototype, 'src', {
                    get: srcProp.get,
                    set: function (value) {
                        if (!/^(blob|data):/i.test(String(value))) {
                            this.crossOrigin = 'anonymous';
                        }
                        srcProp.set.call(this, String(value).replace(/ /g, '%20'));
                    }
                });
            })();

            // Keep the engine order; RPG Maker scripts depend on earlier globals.
            var CDN_SCRIPTS = [
                'js/libs/pixi.js',
                'js/libs/pixi-tilemap.js',
                'js/libs/pixi-picture.js',
                'js/libs/fpsmeter.js',
                'js/libs/lz-string.js',
                'js/libs/iphone-inline-video.browser.js',
                'js/rpg_core.js',
                'js/rpg_managers.js',
                'js/rpg_objects.js',
                'js/rpg_scenes.js',
                'js/rpg_sprites.js',
                'js/rpg_windows.js',
                'js/plugins.js',
                'js/main.js'
            ];

            (function loadScripts() {
                var index = 0;
                function load(url) {
                    var script = document.createElement('script');
                    script.onload = function () {
                        index++;
                        next();
                    };
                    script.onerror = function () {
                        throw new Error('Failed to load game script: ' + script.src);
                    };
                    script.src = url;
                    document.body.appendChild(script);
                }
                function next() {
                    if (index >= CDN_SCRIPTS.length) return;
                    load(CDN_SCRIPTS[index]);
                }
                window.addEventListener('DOMContentLoaded', next);
            })();
        </script>
        <link rel="icon" href="icon/icon.png?2" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>Dorm Janitor's Revenge</title>
    </head>
    <body style="background-color: black">
    </body>
</html>
