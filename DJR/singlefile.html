<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <base href="https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/DJR/">
        <script>
            // Images must opt into CORS before their source is assigned because the
            // game reads pixels for tones, snapshots, and blend-mode checks.
            (function () {
                var srcProp = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
                Object.defineProperty(HTMLImageElement.prototype, 'src', {
                    get: srcProp.get,
                    set: function (value) {
                        if (!/^(blob|data):/i.test(String(value))) {
                            this.crossOrigin = 'anonymous';
                        }
                        srcProp.set.call(this, String(value).replace(/ /g, '%20'));
                    }
                });
            })();

            var CDN_BASE = 'https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/DJR/';
            var RAW_BASE = 'https://raw.githubusercontent.com/CoreScripts/Ripped-games/main/DJR/';

            // jsDelivr can reject encrypted game resources intermittently. Raw GitHub
            // serves those binary files reliably, while JavaScript stays on jsDelivr.
            (function () {
                var open = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url) {
                    var absolute = new URL(url, document.baseURI).href;
                    if (/\.rpgmv[omap]$/i.test(absolute) && absolute.indexOf(CDN_BASE) === 0) {
                        arguments[1] = RAW_BASE + absolute.slice(CDN_BASE.length);
                    }
                    return open.apply(this, arguments);
                };
            })();

            // The published RPG Maker engine predates this canvas hint.
            (function () {
                var getContext = HTMLCanvasElement.prototype.getContext;
                HTMLCanvasElement.prototype.getContext = function (type, options) {
                    if (type === '2d') {
                        options = options || {};
                        options.willReadFrequently = true;
                    }
                    return getContext.call(this, type, options);
                };
            })();

            // These startup messages are diagnostics, not game errors.
            (function () {
                var log = console.log;
                console.log = function () {
                    var message = String(arguments[0] || '');
                    if (/^(ReputationManager: Initialized|Selective SFX Preload: Starting|\s*PixiJS )/.test(message)) return;
                    log.apply(console, arguments);
                };
            })();

            // Keep the engine order; RPG Maker scripts depend on earlier globals.
            var CDN_SCRIPTS = [
                'js/libs/pixi.js',
                'js/libs/pixi-tilemap.js',
                'js/libs/pixi-picture.js',
                'js/libs/fpsmeter.js',
                'js/libs/lz-string.js',
                'js/libs/iphone-inline-video.browser.js',
                'js/rpg_core.js',
                'js/rpg_managers.js',
                'js/rpg_objects.js',
                'js/rpg_scenes.js',
                'js/rpg_sprites.js',
                'js/rpg_windows.js',
                'js/plugins.js',
                'js/main.js'
            ];

            (function loadScripts() {
                var index = 0;
                function load(url) {
                    var script = document.createElement('script');
                    script.onload = function () {
                        if (url === 'js/rpg_core.js') {
                            var drawText = Bitmap.prototype.drawText;
                            Bitmap.prototype.drawText = function () {
                                if (!arguments[5]) arguments[5] = 'left';
                                return drawText.apply(this, arguments);
                            };
                        }
                        index++;
                        next();
                    };
                    script.onerror = function () {
                        throw new Error('Failed to load game script: ' + script.src);
                    };
                    script.src = url;
                    document.body.appendChild(script);
                }
                function next() {
                    if (index >= CDN_SCRIPTS.length) return;
                    load(CDN_SCRIPTS[index]);
                }
                window.addEventListener('DOMContentLoaded', next);
            })();
        </script>
        <link rel="icon" href="icon/icon.png?2" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>Dorm Janitor's Revenge</title>
    </head>
    <body style="background-color: black">
    </body>
</html>
