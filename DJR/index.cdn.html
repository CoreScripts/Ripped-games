        <base href="https://cdn.jsdelivr.net/gh/CoreScripts/Ripped-games@main/DJR/">
        <script>
            // Every relative URL now resolves to jsDelivr. Encode spaces and load
            // cross-origin images with CORS so canvas operations (tone changes,
            // snapshots) don't fail on tainted bitmaps.
            (function () {
                function encode(url) {
                    if (url && typeof url === 'object' && url.href) url = url.href;
                    return typeof url === 'string' ? url.replace(/ /g, '%20') : url;
                }
                var open = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function () {
                    var args = Array.prototype.slice.call(arguments);
                    args[1] = encode(args[1]);
                    return open.apply(this, args);
                };
                var src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
                Object.defineProperty(HTMLImageElement.prototype, 'src', {
                    get: src.get,
                    set: function (value) {
                        if (this.crossOrigin !== 'anonymous') this.crossOrigin = 'anonymous';
                        src.set.call(this, encode(value));
                    }
                });
                if (window.fetch) {
                    var nativeFetch = window.fetch;
                    window.fetch = function (input, init) {
                        input = input instanceof Request ? new Request(encode(input.url), input) : encode(input);
                        return nativeFetch.call(this, input, init);
                    };
                }
            })();
        </script>
