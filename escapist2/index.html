    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #111;
      }
      #unity-container, #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
      }
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #unity-canvas { -webkit-user-drag: none; }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #111;
        overflow: hidden;
        color: #e8e8e8;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        font: 14px 'Comic Sans MS', 'Comic Sans', cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #boot-overlay.hidden { display: none; }

      #boot-title {
        font-size: 20px;
        letter-spacing: 1px;
        opacity: 0.9;
        margin-bottom: 4px;
      }

      #boot-log {
        width: min(480px, 90vw);
        max-height: 45vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        scrollbar-width: thin;
        scrollbar-color: #333 transparent;
      }
      #boot-log::-webkit-scrollbar { width: 4px; }
      #boot-log::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

      .log-line {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.55;
        transition: opacity 0.15s;
      }
      .log-line.pending { opacity: 1; }
      .log-line.error { opacity: 1; color: #ff6b6b; }
      .log-line.done { opacity: 0.45; }

      .log-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .log-pct {
        min-width: 42px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .log-size {
        min-width: 58px;
        text-align: right;
        opacity: 0.7;
        font-size: 13px;
      }

  <body>
    <div id="boot-overlay">

    <div id="unity-container" class="unity-desktop">

      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">

        <div id="unity-fullscreen-button"></div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstanceRef = null;

      var bootOverlay = document.querySelector("#boot-overlay");
      var bootLog = document.querySelector("#boot-log");

      var logLines = {};

      function shouldLog(key) {
        return key.indexOf(".data") !== -1 || key.indexOf(".wasm") !== -1;
      }

      function logStart(key) {
        if (!shouldLog(key)) return;
        var line = document.createElement("div");
        line.className = "log-line pending";
        line.innerHTML =
          '<span class="log-name"></span>' +
          '<span class="log-pct">0%</span>' +
          '<span class="log-size"></span>';
        line.querySelector(".log-name").textContent = key;
        bootLog.appendChild(line);
        logLines[key] = {
          el: line,
          pctEl: line.querySelector(".log-pct"),
          sizeEl: line.querySelector(".log-size")
        };
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      function logProgress(key, frac) {
        var entry = logLines[key];
        if (!entry) return;
        var p = Math.round(Math.min(frac, 1) * 100);
        entry.pctEl.textContent = p + "%";
      }

      function logDone(key, bytes) {
        if (!shouldLog(key)) return;
        var entry = logLines[key];
        if (!entry) return;
        entry.el.className = "log-line done";
        entry.pctEl.textContent = "100%";
        if (typeof bytes === "number") {
          entry.sizeEl.textContent = formatBytes(bytes);
        }
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      function logError(key) {
        if (!shouldLog(key)) return;
        var entry = logLines[key];
        if (!entry) return;
        entry.el.className = "log-line error";
        entry.pctEl.textContent = "fail";
        entry.sizeEl.textContent = "";
      }

      function formatBytes(n) {
        if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
        if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
        return n + " B";
      }

      document.addEventListener("fullscreenchange", function() {
        if (!navigator.keyboard || !navigator.keyboard.lock) return;
        if (document.fullscreenElement) {

            console.warn("Keyboard lock unavailable (Esc exits fullscreen on tap): " + err);
          });

          navigator.keyboard.unlock();
        }

      document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
      document.addEventListener("dragstart", function(e) { e.preventDefault(); });

      function isTypingTarget(el) {

        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      }

      var DATA_FILENAME = "Build/WebGL.data.gz";

      var FRAMEWORK_FILENAME = "Build/WebGL.framework.js.gz";

      async function resolveAssetUrl(filename, manifest, mimeType, onProgress) {
        var entry = manifest[filename];
        if (!entry) throw new Error(filename + " missing from manifest.json");
        var split = entry.partCount > 1;
        if (!split) logStart(filename);

            onProgress: function(loaded, total) {

            onPart: function(part, state, bytes) {
              if (state === "start") logStart(part);
              else if (state === "done") logDone(part, bytes);
              else logError(part);
            }
          });
        } catch (err) {
          if (!split) logError(filename);
          throw err;
        }
        if (!split) logDone(filename, buf.byteLength);
        if (onProgress) onProgress(1);

        var head = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));

           var dataUrl = await resolveAssetUrl(DATA_FILENAME, manifest, null, function(p) {

           bootStage = "loading " + CODE_FILENAME;
           var codeUrl = await resolveAssetUrl(CODE_FILENAME, manifest, "application/wasm", function(p) {

           });

           var frameworkUrl = await resolveAssetUrl(FRAMEWORK_FILENAME, manifest, "application/javascript", function(p) {
             progressState.framework = p;
             updateOverallProgress();
           });

          config.dataUrl = dataUrl;
          config.codeUrl = codeUrl;
          config.frameworkUrl = frameworkUrl;

           bootStage = "loading Unity loader";
           var loaderBuf = await window.__portRepo.fetchFile(LOADER_FILENAME);
          var script = document.createElement("script");
          script.src = URL.createObjectURL(new Blob([loaderBuf], { type: "application/javascript" }));
           script.onload = () => {
             bootStage = "starting Unity";
            createUnityInstance(canvas, config, (progress) => {
              progressState.instantiate = progress;
              updateOverallProgress();
            }).then((unityInstance) => {
              unityInstanceRef = unityInstance;
              window.unityInstance = unityInstance;
              bootOverlay.classList.add("hidden");
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
              if (config.dataUrl.startsWith("blob:")) URL.revokeObjectURL(config.dataUrl);
              if (config.codeUrl.startsWith("blob:")) URL.revokeObjectURL(config.codeUrl);
              if (config.frameworkUrl.startsWith("blob:")) URL.revokeObjectURL(config.frameworkUrl);

             }).catch((message) => {
              alert(message);
            });
          };
          document.body.appendChild(script);

         } catch (err) {
           var message = "Failed during " + bootStage + ": " + err.message;
           bootLog.textContent = "";
           var errorLine = document.createElement("div");
           errorLine.className = "log-line error";
           errorLine.textContent = message;
           bootLog.appendChild(errorLine);
           unityShowBanner(message, "error");
           console.error(err);
        }
      }

      boot();
    </script>
  </body>
</html>
